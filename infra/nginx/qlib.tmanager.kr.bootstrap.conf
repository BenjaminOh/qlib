# BOOTSTRAP-ONLY conf — used while issuing the very first SSL cert.
#
# nginx -t fails if `qlib.tmanager.kr.conf` (the production version) is loaded
# before /etc/letsencrypt/live/qlib.tmanager.kr/ exists. So during the initial
# bootstrap we drop only this HTTP-80 server block (just enough for certbot's
# webroot challenge), reload, issue the cert, then swap in the production conf.
#
# Steps:
#   1. cp this file → /root/deploy/nginx-waf/conf.d/qlib.tmanager.kr.conf
#   2. docker exec nginx-waf-blue nginx -t && nginx -s reload
#   3. certbot certonly --webroot -w /var/lib/docker/volumes/nginx-waf_certbot-webroot/_data ...
#   4. cp infra/nginx/qlib.tmanager.kr.conf → /root/deploy/nginx-waf/conf.d/  (overwrite)
#   5. nginx -t && nginx -s reload

server {
    listen 80;
    server_name qlib.tmanager.kr;

    # Webroot challenge directory (Docker volume nginx-waf_certbot-webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Pre-cert period: return a clear "site coming up" message instead of redirecting
    # to a https URL whose cert doesn't exist yet.
    location / {
        return 503 "qlib.tmanager.kr — SSL bootstrap in progress\n";
        add_header Content-Type text/plain;
    }
}
