# /etc/nginx/conf.d/qlib.tmanager.kr.conf  (mounted into nginx-waf-blue)
#
# ⛔ 2026-11-12 사용자 결정: qlib 웹서비스 종료 — 도메인 전체를 닫는다.
#   - 이유: 웹 화면(Next.js 14)에 치명 취약점(이미지 최적화 RCE 등)이 쌓였고, 앱(qrunner)이
#     허브를 쓰는 데 웹이 필요 없다. 공격면을 0 으로 만든다.
#   - 허브(api·worker·scheduler)는 그대로 돈다. runner 는 공개 도메인이 아니라 app-network 의
#     `qlib-hub-api:5001` 로 feed 를 읽고, 앱은 qrunner gateway 만 쓴다 → 영향 없음.
#   - 웹에서 하던 일(계좌 설정 등)은 서버에서 직접 한다.
#   - 되살리려면 이 파일을 git 이력(2026-11-12 이전)으로 되돌리고 deploy.sh 에 web 을 다시 넣는다.
#
# 444 = 응답 없이 연결을 끊는다(스캐너에게 아무 정보도 주지 않는다).
# 인증서 갱신 경로만 남긴다 — 공용 certbot renew cron 이 이 도메인에서 실패 알림을 내지 않게.

server {
    listen 80;
    server_name qlib.tmanager.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    server_name qlib.tmanager.kr;

    ssl_certificate     /etc/nginx/ssl/live/qlib.tmanager.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/qlib.tmanager.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # deploy.sh 가 blue/green 전환 때 이 include 의 심볼릭 링크를 바꾸고 `nginx -t` 를 한다.
    # 프록시는 안 하지만 그 단계가 깨지지 않게 남겨 둔다.
    include /etc/nginx/conf.d/qlib-url.inc;

    location / {
        return 444;
    }
}
