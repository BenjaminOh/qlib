# /etc/nginx/conf.d/qlib.tmanager.kr.conf  (mounted into nginx-waf-blue)
#
# Mirrors the newsro.tmanager.kr pattern already running on rocky-monitor.
# Blue/Green is handled by `qlib-url.inc` (active.inc symlink) — see
# infra/nginx/qlib-url-blue.inc and qlib-url-green.inc.

# ───── HTTP : redirect → HTTPS, allow ACME challenge ────────────
server {
    listen 80;
    server_name qlib.tmanager.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ───── HTTPS : SSL termination + WAF rules + reverse-proxy ──────
server {
    listen 443 ssl;
    server_name qlib.tmanager.kr;

    ssl_certificate     /etc/nginx/ssl/live/qlib.tmanager.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/qlib.tmanager.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auth is handled at the application layer now (FastAPI JWT + Next.js
    # middleware → /login page). nginx-waf no longer enforces basic auth;
    # bot scanners hit Next.js's middleware, which redirects them to /login
    # without exposing any protected content.

    # Pulls $qlib_web_url and $qlib_api_url from the active include
    # (toggled by deploy.sh). Symlink mapping:
    #   /etc/nginx/conf.d/qlib-url.inc → qlib-url-blue.inc | qlib-url-green.inc
    include /etc/nginx/conf.d/qlib-url.inc;

    # 보안 헤더(2026-10-26 점검: 6종 모두 없었다). location 에 add_header 를 두면
    # 이 상속이 끊기므로 아래 location 들에는 add_header 를 쓰지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 는 관찰부터 — Next.js 인라인 스크립트가 있어 script-src 는 아직 걸지 않는다.
    add_header Content-Security-Policy-Report-Only "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # 로그인 — 공용 zone auth_login(IP 당 10r/m, zz-ratelimit.conf). 앱의 Redis
    # 잠금은 Redis 장애 때 꺼지므로(fail-open) 여기서 한 번 더 막는다.
    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $qlib_api_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runner feed — internal only. Runners call the api container over
    # app-network; the public hostname must never serve it.
    location /api/v1/feed/ {
        return 404;
    }

    # API routing — strips /api prefix, passes to FastAPI
    location /api/ {
        client_max_body_size 50M;
        proxy_pass $qlib_api_url;        # http://172.17.0.1:25023  (or 25025)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Web routing — Next.js standalone
    location / {
        client_max_body_size 50M;
        proxy_pass $qlib_web_url;        # http://172.17.0.1:25022  (or 25024)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
