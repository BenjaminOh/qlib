# /etc/nginx/conf.d/qlib.tmanager.kr.conf  (mounted into nginx-waf-blue)
#
# Mirrors the newsro.tmanager.kr pattern already running on rocky-monitor.
# Blue/Green is handled by `qlib-url.inc` (active.inc symlink) — see
# infra/nginx/qlib-url-blue.inc and qlib-url-green.inc.

# ───── HTTP : redirect → HTTPS, allow ACME challenge ────────────
server {
    listen 80;
    server_name qlib.tmanager.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ───── HTTPS : SSL termination + WAF rules + reverse-proxy ──────
server {
    listen 443 ssl;
    server_name qlib.tmanager.kr;

    ssl_certificate     /etc/nginx/ssl/live/qlib.tmanager.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/qlib.tmanager.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ─── Closed-site basic auth ───────────────────────────────────
    # All locations below inherit this auth requirement, blocking bot
    # scanners (wp-admin/.env/admin.php probes) at the proxy layer
    # before they reach FastAPI/Next.js. The htpasswd file is provisioned
    # manually on rocky-monitor (NOT in git — see docs/QUICKSTART.md).
    # The HTTP→HTTPS redirect block (port 80) intentionally has no auth
    # so ACME challenges still succeed for cert renewal.
    auth_basic "Qlib Restricted";
    auth_basic_user_file /etc/nginx/conf.d/qlib.htpasswd;

    # Pulls $qlib_web_url and $qlib_api_url from the active include
    # (toggled by deploy.sh). Symlink mapping:
    #   /etc/nginx/conf.d/qlib-url.inc → qlib-url-blue.inc | qlib-url-green.inc
    include /etc/nginx/conf.d/qlib-url.inc;

    # API routing — strips /api prefix, passes to FastAPI
    location /api/ {
        client_max_body_size 50M;
        proxy_pass $qlib_api_url;        # http://172.17.0.1:25023  (or 25025)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Web routing — Next.js standalone
    location / {
        client_max_body_size 50M;
        proxy_pass $qlib_web_url;        # http://172.17.0.1:25022  (or 25024)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
